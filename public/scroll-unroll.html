<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Vertical Scroll Unrolling Page | Three.js</title>
  
  <!-- Modern Architectural & Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Pristine Plain White Layout - Zero background textures */
    html {
      width: 100%;
      height: 100%;
      background-color: #ffffff !important;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: auto;
    }

    body {
      width: 100%;
      min-height: 220vh;
      background-color: #ffffff !important;
      color: #111827;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    body:active {
      cursor: grabbing;
    }

    /* Fixed WebGL Canvas Surface Fitting Full Viewport */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      background-color: #ffffff !important;
    }

    /* Native Scroll Runway */
    .scroll-spacer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 220vh;
      pointer-events: none;
      z-index: 2;
    }

    /* Ultra-Minimal Discreet Progress Bar at the very bottom edge (No tutorial text) */
    #progress-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 3px;
      background: rgba(0, 0, 0, 0.06);
      z-index: 50;
      cursor: pointer;
    }

    #progress-bar-fill {
      height: 100%;
      width: 3%;
      background: #111827;
      transition: width 0.04s linear;
    }

    /* Hardware acceleration fallback */
    #fallback-msg {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 36px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      text-align: center;
      font-family: sans-serif;
      z-index: 100;
    }
  </style>

  <!-- Three.js UMD bundle -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <!-- WebGL Render Surface -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Native Scroll Runway -->
  <div class="scroll-spacer"></div>

  <!-- Ultra-Minimal Bottom Scrubber Line (Zero Tutorial Text) -->
  <div id="progress-bar-container" title="Click or drag to scrub">
    <div id="progress-bar-fill"></div>
  </div>

  <div id="fallback-msg">
    <h3>WebGL Support Required</h3>
    <p>Please enable hardware acceleration in your browser to view the 3D scroll unrolling.</p>
  </div>

  <script>
    (function () {
      'use strict';

      if (typeof THREE === 'undefined') {
        document.getElementById('fallback-msg').style.display = 'block';
        return;
      }

      /* ==========================================================================
         1. DYNAMIC HIGH-RES ARCHITECTURAL DRAWINGS (SOLID WHITE, ZERO TEXTURE)
         ========================================================================== */

      /**
       * Generates a high-resolution canvas with architectural elevation drawings,
       * cantilever schematics, floor plans, and technical specifications.
       * Solid pure white background (#ffffff) with zero background noise or grid textures.
       */
      function createOffscreenDocumentCanvas(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        // Pure solid white background - NO background textures
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // 1. Precision Technical Drafting Borders
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 3.5;
        ctx.strokeRect(36, 36, width - 72, height - 72);

        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        ctx.strokeRect(46, 46, width - 92, height - 92);

        // Corner registration marks
        function drawCrosshair(x, y) {
          ctx.strokeStyle = '#111827';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y);
          ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 12);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.stroke();
        }

        drawCrosshair(36, 36);
        drawCrosshair(width - 36, 36);
        drawCrosshair(36, height - 36);
        drawCrosshair(width - 36, height - 36);

        // Edge coordinate indicators
        ctx.fillStyle = '#6b7280';
        ctx.font = '600 12px "Space Mono", monospace';
        const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K'];
        for (let i = 0; i < cols.length; i++) {
          const x = 90 + i * ((width - 180) / (cols.length - 1));
          ctx.fillText(cols[i], x - 4, 28);
          ctx.fillText(cols[i], x - 4, height - 20);
          ctx.strokeStyle = '#9ca3af';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, 32); ctx.lineTo(x, 36);
          ctx.moveTo(x, height - 36); ctx.lineTo(x, height - 32);
          ctx.stroke();
        }

        // 2. Header Block & Folio Identification
        ctx.fillStyle = '#111827';
        ctx.font = '700 13px "Space Mono", monospace';
        ctx.letterSpacing = '5px';
        ctx.textAlign = 'center';
        ctx.fillText('ASTERISKS ARCHITECTURAL GUILD · MASTER FOLIO AR-01', width * 0.5, 95);

        ctx.font = '800 42px "Cinzel", serif';
        ctx.letterSpacing = '3px';
        ctx.fillText('SUSTAINABLE ARCHITECTURAL PAVILION', width * 0.5, 150);

        ctx.font = 'italic 16px "Playfair Display", serif';
        ctx.fillStyle = '#4b5563';
        ctx.fillText('Structural Cantilevers, Facade Kinetics & Tectonic Assemblies · Elevation North', width * 0.5, 185);

        // Clean divider line
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(140, 210);
        ctx.lineTo(width - 140, 210);
        ctx.stroke();

        // 3. Architectural Elevation Drawing
        const elevY = 250;
        ctx.fillStyle = '#111827';
        ctx.font = '700 14px "Space Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('FIGURE 1.0 : NORTH ELEVATION & PRIMARY STEEL TRUSS MORPHOLOGY', 80, elevY);

        // Ground datum line
        const groundY = elevY + 280;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#111827';
        ctx.beginPath();
        ctx.moveTo(80, groundY);
        ctx.lineTo(width - 80, groundY);
        ctx.stroke();

        // Slanted aerodynamic roof profile
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(120, elevY + 65);
        ctx.lineTo(width * 0.5, elevY + 30);
        ctx.lineTo(width - 120, elevY + 75);
        ctx.lineTo(width - 120, elevY + 95);
        ctx.lineTo(width * 0.5, elevY + 50);
        ctx.lineTo(120, elevY + 85);
        ctx.closePath();
        ctx.fillStyle = '#f8fafc';
        ctx.fill();
        ctx.stroke();

        // Structural columns
        const numCols = 9;
        for (let i = 0; i < numCols; i++) {
          const colX = 160 + i * ((width - 320) / (numCols - 1));
          ctx.fillStyle = '#111827';
          ctx.fillRect(colX - 4, elevY + 50, 8, groundY - (elevY + 50));
        }

        // Curtain wall mullion grid
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        for (let my = elevY + 80; my < groundY; my += 28) {
          ctx.beginPath();
          ctx.moveTo(130, my);
          ctx.lineTo(width - 130, my);
          ctx.stroke();
        }
        for (let mx = 130; mx < width - 130; mx += 36) {
          ctx.beginPath();
          ctx.moveTo(mx, elevY + 80);
          ctx.lineTo(mx, groundY);
          ctx.stroke();
        }

        // Dimension lines with arrows
        function drawDimensionLine(x1, y1, x2, y2, label) {
          ctx.save();
          ctx.strokeStyle = '#4b5563';
          ctx.fillStyle = '#4b5563';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x1 - 4, y1 - 4); ctx.lineTo(x1 + 4, y1 + 4);
          ctx.moveTo(x2 - 4, y2 - 4); ctx.lineTo(x2 + 4, y2 + 4);
          ctx.stroke();
          ctx.font = '600 11px "Space Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(label, (x1 + x2) * 0.5, ((y1 + y2) * 0.5) - 5);
          ctx.restore();
        }

        drawDimensionLine(120, elevY + 16, width - 120, elevY + 16, '48,000 MM STRUCTURAL CANTILEVER SPAN');
        drawDimensionLine(width - 60, elevY + 30, width - 60, groundY, '12,400 MM');

        // 4. Section 2: Ground Plan Schematic & Rotunda Atrium
        const planY = groundY + 55;
        ctx.fillStyle = '#111827';
        ctx.font = '700 14px "Space Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('FIGURE 2.0 : LEVEL 01 SANCTUARY & ROTUNDA ATRIUM GEOMETRY', 80, planY);

        const planBoxH = 240;
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2;
        ctx.strokeRect(180, planY + 25, width - 360, planBoxH);

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(230, planY + 55, width - 460, planBoxH - 60);

        // Circular rotunda gallery in center
        ctx.beginPath();
        ctx.arc(width * 0.5, planY + 25 + planBoxH * 0.5, 75, 0, Math.PI * 2);
        ctx.stroke();

        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(width * 0.5, planY + 25 + planBoxH * 0.5, 100, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#111827';
        ctx.font = '700 12px "Space Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CENTRAL GALLERY ROTUNDA', width * 0.5, planY + 20 + planBoxH * 0.5);
        ctx.font = '400 11px "Space Mono", monospace';
        ctx.fillStyle = '#6b7280';
        ctx.fillText('HONED TERRAZZO FLOORING', width * 0.5, planY + 36 + planBoxH * 0.5);

        ctx.fillText('WEST PAVILION · CURATORIAL', 260, planY + 25 + planBoxH * 0.5);
        ctx.fillText('EAST ARCHIVE · SCIENTIFIC VAULT', width - 260, planY + 25 + planBoxH * 0.5);

        // 5. Section 3: Technical Component Schedule
        const tableY = planY + planBoxH + 50;
        ctx.font = '800 20px "Cinzel", serif';
        ctx.fillStyle = '#111827';
        ctx.textAlign = 'left';
        ctx.fillText('I. STRUCTURAL COMPONENT SCHEDULE', 80, tableY);

        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2;
        ctx.strokeRect(80, tableY + 18, width - 160, 160);

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(81, tableY + 19, width - 162, 34);

        ctx.fillStyle = '#111827';
        ctx.font = '700 12px "Space Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('ID', 100, tableY + 41);
        ctx.fillText('CLASSIFICATION', 220, tableY + 41);
        ctx.fillText('MATERIAL SPECIFICATION', 520, tableY + 41);
        ctx.fillText('FIRE RATING', width - 360, tableY + 41);
        ctx.fillText('STATUS', width - 180, tableY + 41);

        const rows = [
          ['01', 'PRIMARY STRUCTURE', 'Hot-Rolled S355 Architectural Steel', 'REI 120', 'APPROVED'],
          ['02', 'FACADE CURTAIN', 'Triple-Glazed Low-E Structural Glass', 'Class A1', 'SPECIFIED'],
          ['03', 'ROOFING DIAPHRAGM', 'Zinc Standing Seam · Charcoal Finish', 'Broof(t1)', 'CERTIFIED']
        ];

        ctx.font = '400 12px "Space Mono", monospace';
        rows.forEach((r, idx) => {
          const ry = tableY + 84 + idx * 34;
          ctx.strokeStyle = '#e5e7eb';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(80, ry - 16); ctx.lineTo(width - 80, ry - 16);
          ctx.stroke();

          ctx.fillStyle = idx === 0 ? '#111827' : '#4b5563';
          ctx.fillText(r[0], 100, ry);
          ctx.fillText(r[1], 220, ry);
          ctx.fillText(r[2], 520, ry);
          ctx.fillText(r[3], width - 360, ry);
          ctx.fillText(r[4], width - 180, ry);
        });

        // 6. Section 4: Authentication Seal
        const sealY = tableY + 260;
        const sealX = width * 0.5;

        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sealX, sealY, 68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(sealX, sealY, 60, 0, Math.PI * 2);
        ctx.stroke();

        ctx.save();
        ctx.translate(sealX, sealY);
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2.5;
        for (let a = 0; a < 8; a++) {
          ctx.rotate(Math.PI / 4);
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(0, 34);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 38, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#111827';
          ctx.fill();
        }
        ctx.restore();

        ctx.font = '700 11px "Space Mono", monospace';
        ctx.fillStyle = '#111827';
        ctx.textAlign = 'center';
        ctx.fillText('AUTHENTICATED · ASTERISKS ARCHITECTURAL GUILD · 2026', sealX, sealY + 92);

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = 8;
        texture.generateMipmaps = true;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.needsUpdate = true;
        return texture;
      }


      /* ==========================================================================
         2. GLSL SHADER PIPELINE (FULL-SCREEN CYLINDER UNROLL - ZERO TEXTURE BEHIND)
         ========================================================================== */

      const vertexShader = [
        'uniform float uProgress;',
        'uniform float uPlaneHeight;',
        'uniform float uPlaneWidth;',
        'uniform float uBaseRadius;',
        'uniform float uSpiralFactor;',

        'varying vec2 vUv;',
        'varying vec3 vPosition;',
        'varying vec3 vNormal;',

        'void main() {',
        '  vUv = uv;',
        '',
        '  // Rolling boundary curl line along Y:',
        '  // At uProgress = 0.02, curlY is near bottom (-0.5 * H) -> sheet curled into cylinder',
        '  // At uProgress = 1.0, curlY reaches top (+0.5 * H) -> entire sheet unrolls flat to fill screen',
        '  float curlY = -uPlaneHeight * 0.5 + (uPlaneHeight * uProgress);',
        '',
        '  vec3 pos = position;',
        '  vec3 n = normal;',
        '',
        '  if (pos.y <= curlY) {',
        '    // 1. Flat unrolled section flush with screen:',
        '    pos.z = 0.0;',
        '    n = vec3(0.0, 0.0, 1.0);',
        '  } else {',
        '    // 2. Curled top roll (Archimedean spiral cylinder along X axis):',
        '    float s = pos.y - curlY;',
        '    float R = uBaseRadius + uSpiralFactor * s;',
        '    float theta = s / R;',
        '',
        '    float y_curl = curlY + sin(theta) * R;',
        '    float z_curl = (1.0 - cos(theta)) * R;',
        '',
        '    pos.y = y_curl;',
        '    pos.z = z_curl;',
        '',
        '    // Rotated normal around X axis',
        '    n = vec3(0.0, -sin(theta), cos(theta));',
        '  }',
        '',
        '  vPosition = (modelMatrix * vec4(pos, 1.0)).xyz;',
        '  vNormal = normalize(normalMatrix * n);',
        '',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
        '}'
      ].join('\n');

      const fragmentShader = [
        'uniform sampler2D uContentTexture;',
        'uniform vec3 uLightPos;',
        'uniform vec3 uLightColor;',
        'uniform vec3 uAmbientColor;',

        'varying vec2 vUv;',
        'varying vec3 vPosition;',
        'varying vec3 vNormal;',

        'void main() {',
        '  // If looking at the reverse / back side of the cylinder roll, render solid pure flat white (NO texture behind page!)',
        '  if (!gl_FrontFacing) {',
        '    gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);',
        '    return;',
        '  }',
        '',
        '  // Front face: pure crisp white paper with architectural drafting lines',
        '  vec4 contentTex = texture2D(uContentTexture, vUv);',
        '',
        '  // Studio Lighting for 3D roll curvature depth',
        '  vec3 L = normalize(uLightPos - vPosition);',
        '  vec3 V = normalize(cameraPosition - vPosition);',
        '  vec3 H = normalize(L + V);',
        '',
        '  float diff = max(dot(vNormal, L), 0.0);',
        '  float wrapDiff = max(0.0, (dot(vNormal, L) + 0.35) / 1.35);',
        '  float spec = pow(max(dot(vNormal, H), 0.0), 32.0) * 0.05;',
        '',
        '  vec3 totalLight = uAmbientColor + uLightColor * (diff * 0.45 + wrapDiff * 0.25) + vec3(spec);',
        '  gl_FragColor = vec4(contentTex.rgb * totalLight, 1.0);',
        '}'
      ].join('\n');


      /* ==========================================================================
         3. THREE.JS PIPELINE (FULL SCREEN VIEWPORT FRAMING)
         ========================================================================== */

      const canvasElement = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas: canvasElement,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0xffffff, 1.0); // Solid pure white
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff); // Pure white background

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 7.0);
      camera.lookAt(0, 0, 0);

      // Studio Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.90);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);
      keyLight.position.set(3.0, 5.0, 4.5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xf8fafc, 0.35);
      fillLight.position.set(-3.0, -2.5, 3.5);
      scene.add(fillLight);

      // Dynamic Dimension Calculator (Fits the page to the whole screen)
      let planeWidth = 1;
      let planeHeight = 1;
      let contentTexture = null;

      const shaderMaterial = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        side: THREE.DoubleSide,
        uniforms: {
          uProgress: { value: 0.03 },
          uPlaneHeight: { value: 1.0 },
          uPlaneWidth: { value: 1.0 },
          uBaseRadius: { value: 0.28 },
          uSpiralFactor: { value: 0.024 },
          uContentTexture: { value: null },
          uLightPos: { value: new THREE.Vector3(3.0, 5.0, 4.5) },
          uLightColor: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
          uAmbientColor: { value: new THREE.Vector3(0.88, 0.88, 0.90) }
        }
      });

      let scrollMesh = null;

      function updateDimensions() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Calculate exact visible viewport boundaries at z = 0
        const vFovRad = (camera.fov * Math.PI) / 180;
        const visibleHeight = 2 * Math.tan(vFovRad / 2) * camera.position.z;
        const visibleWidth = visibleHeight * camera.aspect;

        // Make the scroll page fit the whole screen
        planeWidth = visibleWidth;
        planeHeight = visibleHeight;

        if (scrollMesh) {
          scrollMesh.geometry.dispose();
          scrollMesh.geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 160, 480);
        } else {
          const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 160, 480);
          scrollMesh = new THREE.Mesh(geometry, shaderMaterial);
          scene.add(scrollMesh);
        }

        shaderMaterial.uniforms.uPlaneWidth.value = planeWidth;
        shaderMaterial.uniforms.uPlaneHeight.value = planeHeight;
        shaderMaterial.uniforms.uBaseRadius.value = visibleHeight * 0.055;

        // Regenerate texture to match screen aspect ratio
        const texW = 2048;
        const texH = Math.round(2048 / camera.aspect);
        if (contentTexture) contentTexture.dispose();
        contentTexture = createOffscreenDocumentCanvas(texW, texH);
        shaderMaterial.uniforms.uContentTexture.value = contentTexture;
      }

      window.addEventListener('resize', updateDimensions);
      updateDimensions();


      /* ==========================================================================
         4. MULTI-MODAL SCROLL ENGINE (RESPONSIVE, ZERO CONFLICT)
         ========================================================================== */

      let targetProgress = 0.03;
      let currentProgress = 0.03;
      const lerpFactor = 0.12;

      const progressBarFill = document.getElementById('progress-bar-fill');
      const progressBarContainer = document.getElementById('progress-bar-container');

      let isProgrammaticScroll = false;

      function syncWindowScrollFromProgress() {
        isProgrammaticScroll = true;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          const targetY = ((targetProgress - 0.02) / 0.98) * maxScroll;
          window.scrollTo({ top: targetY, behavior: 'instant' });
        }
        requestAnimationFrame(function () {
          isProgrammaticScroll = false;
        });
      }

      // 1. Direct Mouse Wheel Driver
      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        const delta = e.deltaY * 0.00048;
        targetProgress = Math.min(1.0, Math.max(0.02, targetProgress + delta));
        syncWindowScrollFromProgress();
      }, { passive: false });

      // 2. Click & Drag on Screen (Tactile Physical Paper Pull)
      let isDraggingPage = false;
      let dragStartY = 0;
      let progressAtDragStart = 0;

      window.addEventListener('mousedown', function (e) {
        if (e.target.closest('#progress-bar-container')) return;
        isDraggingPage = true;
        dragStartY = e.clientY;
        progressAtDragStart = targetProgress;
        document.body.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDraggingPage) return;
        const deltaY = dragStartY - e.clientY;
        const progressDelta = deltaY / (window.innerHeight * 0.85);
        targetProgress = Math.min(1.0, Math.max(0.02, progressAtDragStart + progressDelta));
        syncWindowScrollFromProgress();
      });

      window.addEventListener('mouseup', function () {
        if (isDraggingPage) {
          isDraggingPage = false;
          document.body.style.cursor = 'grab';
        }
      });

      // 3. Touch Drag (Mobile / Tablet)
      let touchStartY = 0;
      let touchProgressStart = 0;

      window.addEventListener('touchstart', function (e) {
        if (e.touches.length > 0) {
          touchStartY = e.touches[0].clientY;
          touchProgressStart = targetProgress;
        }
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        if (e.touches.length > 0) {
          const deltaY = touchStartY - e.touches[0].clientY;
          const progressDelta = deltaY / (window.innerHeight * 0.85);
          targetProgress = Math.min(1.0, Math.max(0.02, touchProgressStart + progressDelta));
          syncWindowScrollFromProgress();
        }
      }, { passive: false });

      // 4. Native Browser Scrollbar
      window.addEventListener('scroll', function () {
        if (isProgrammaticScroll) return;
        const docEl = document.documentElement;
        const body = document.body;
        const scrollTop = window.pageYOffset || docEl.scrollTop || body.scrollTop || 0;
        const scrollHeight = Math.max(docEl.scrollHeight, body.scrollHeight);
        const clientHeight = docEl.clientHeight || window.innerHeight;
        const maxScroll = scrollHeight - clientHeight;
        if (maxScroll > 0) {
          const frac = Math.min(1.0, Math.max(0.0, scrollTop / maxScroll));
          targetProgress = 0.02 + frac * 0.98;
        }
      }, { passive: true });

      // 5. Minimal Bottom Scrubber Line
      let isDraggingBar = false;
      function seekFromBar(e) {
        const rect = progressBarContainer.getBoundingClientRect();
        const x = Math.min(rect.width, Math.max(0, e.clientX - rect.left));
        const frac = x / rect.width;
        targetProgress = 0.02 + frac * 0.98;
        syncWindowScrollFromProgress();
      }

      progressBarContainer.addEventListener('mousedown', function (e) {
        isDraggingBar = true;
        seekFromBar(e);
      });
      window.addEventListener('mousemove', function (e) {
        if (isDraggingBar) seekFromBar(e);
      });
      window.addEventListener('mouseup', function () {
        isDraggingBar = false;
      });

      // 6. Keyboard Accessibility
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
          targetProgress = Math.min(1.0, targetProgress + 0.07);
          syncWindowScrollFromProgress();
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          targetProgress = Math.max(0.02, targetProgress - 0.07);
          syncWindowScrollFromProgress();
        } else if (e.key === 'Home') {
          targetProgress = 0.02;
          syncWindowScrollFromProgress();
        } else if (e.key === 'End') {
          targetProgress = 1.0;
          syncWindowScrollFromProgress();
        }
      });


      /* ==========================================================================
         5. ANIMATION & RENDER LOOP
         ========================================================================== */

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        currentProgress += (targetProgress - currentProgress) * lerpFactor;
        shaderMaterial.uniforms.uProgress.value = currentProgress;

        // Bottom scrubber update
        const percentVal = Math.min(100, Math.max(0, currentProgress * 100));
        progressBarFill.style.width = percentVal.toFixed(1) + '%';

        // Symmetrical Centering Dynamics:
        // Keeps the active document centered in the viewport so both the top roll
        // and bottom edge expand outward to fit the entire screen.
        const centerOffsetY = (1.0 - currentProgress) * (planeHeight * 0.5);
        scrollMesh.position.y = centerOffsetY;

        // Subtle ambient floating motion
        const t = clock.getElapsedTime();
        scrollMesh.position.y += Math.sin(t * 0.8) * 0.012;

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
